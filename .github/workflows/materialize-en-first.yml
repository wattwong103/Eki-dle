name: Materialize EN-first sources
on:
  workflow_dispatch:
  push:
    branches: [fix/en-first-labels]
    paths:
      - "scripts/*.en.patch"
      - "scripts/restore-*.mjs"
      - "scripts/materialize-en.mjs"
      - "scripts/build-line-en.mjs"
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/en-first-labels
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Materialize from patches + line-en builder
        run: node scripts/materialize-en.mjs
      - name: Commit materialized sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-data.mjs src/app.ts public/data/line-en.json || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: materialize EN-first build-data, app.ts, line-en.json"
            git push
          fi
